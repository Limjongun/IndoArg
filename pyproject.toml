[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indoarg"
version = "0.1.0"
description = "IndoArg: Indonesian everyday language to executable tool arguments benchmark for local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "ollama>=0.4",
    "httpx>=0.27",
    "tenacity>=8.2",
    "huggingface_hub>=0.24",
    "gguf>=0.10",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "dateparser>=1.2",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "rich>=13.7",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "jupyterlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
